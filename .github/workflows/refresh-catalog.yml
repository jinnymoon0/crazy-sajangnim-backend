# Refresh the sale catalog every hour.
#
# One storefront per run, rotating, so each of the four is re-collected
# every four hours — six times a day, against once a day before.
#
# Why not all four every hour. Two reasons, both measured:
#
# A full pass takes five minutes (82s, 27s, 92s, 98s against the live
# backend). Billed per job and rounded up to the minute, all four hourly
# is roughly 4,300 minutes a month against the 2,000 this plan includes.
# It would stop part-way through the month — which is exactly the silent
# staleness this schedule exists to prevent. One storefront per run
# costs about 1,400.
#
# And each pass walks every retailer we read. Four sweeps an hour is 96
# a day against shops that already answer 429 when pushed; rotating
# spreads that load rather than multiplying it.
#
# To collect all four at once, run this by hand with "all" ticked.
#
# This used to be four Vercel cron jobs. They never fired — the project
# is on a plan that does not run four hour-precise schedules, and
# nothing said so. Every collection timestamp landed outside the
# scheduled window while the catalog quietly went stale.
#
# Note: scheduled runs can be delayed when GitHub is busy. That is the
# trade for not paying for a scheduler.

name: Refresh catalog

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      all:
        description: "Collect all four storefronts, not just this hour's one"
        type: boolean
        default: false

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  # Deliberately one job rather than a matrix. Every matrix entry is
  # billed as its own job rounded up to the minute, which cost more in
  # rounding than in work.
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Collect
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://crazy-sajangnim-backend.vercel.app' }}
          COLLECT_ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings → Secrets and variables → Actions, matching the value in the Vercel project."
            exit 1
          fi

          combos=("US MEN" "US WOMEN" "KR MEN" "KR WOMEN")

          if [ "${COLLECT_ALL}" = "true" ]; then
            selected=("${combos[@]}")
            echo "Collecting all four storefronts."
          else
            # The hour picks the storefront, so a missed run does not
            # shift the rotation: each one still comes round every four
            # hours regardless of what ran before it. 10# forces base
            # ten, or 08 and 09 would be read as bad octal.
            idx=$(( 10#$(date -u +%H) % 4 ))
            selected=("${combos[$idx]}")
            echo "Hour $(date -u +%H) UTC selects: ${combos[$idx]}"
          fi

          failed=0

          for combo in "${selected[@]}"; do
            set -- ${combo}
            market="$1"
            gender="$2"

            echo "--- ${market} ${gender}"

            http_status=$(curl -sS --max-time 330 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -o response.json -w '%{http_code}' \
              "${BACKEND_URL}/api/cron/refresh-products?market=${market}&gender=${gender}") || {
                echo "::error::Could not reach ${BACKEND_URL} for ${market} ${gender}."
                failed=1
                continue
              }

            cat response.json
            echo

            if [ "${http_status}" != "200" ]; then
              echo "::error::${market} ${gender}: the endpoint answered ${http_status}."
              failed=1
              continue
            fi

            # A 200 is not success on its own: the route reports the
            # outcome of the collection in the body, and an upstream
            # that refused still comes back well-formed.
            ok=$(python3 -c "import json;print(json.load(open('response.json')).get('ok'))")
            count=$(python3 -c "import json;print(json.load(open('response.json')).get('count', 0))")

            if [ "${ok}" != "True" ]; then
              echo "::error::${market} ${gender} did not refresh."
              failed=1
              continue
            fi

            echo "### ${market} ${gender}: ${count} products" >> "${GITHUB_STEP_SUMMARY}"
          done

          exit "${failed}"

      # Folded into this job rather than given its own. Collecting
      # thousands of products means nothing if the shop is serving an
      # empty page, and a separate job would cost another billed minute
      # every hour to learn the same thing.
      - name: Is the shop actually serving
        if: always()
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://crazy-sajangnim-backend.vercel.app' }}
          BACKEND_API_TOKEN: ${{ secrets.BACKEND_API_TOKEN }}
        run: |
          set -euo pipefail

          auth=()
          if [ -n "${BACKEND_API_TOKEN:-}" ]; then
            auth=(-H "Authorization: Bearer ${BACKEND_API_TOKEN}")
          fi

          http_status=$(curl -sS --max-time 60 "${auth[@]}" \
            -o health.json -w '%{http_code}' \
            "${BACKEND_URL}/api/health") || {
              echo "::error::Could not reach ${BACKEND_URL}."
              exit 1
            }

          cat health.json
          echo

          if [ "${http_status}" != "200" ]; then
            echo "::error::The shop is not serving. See the report above."
            exit 1
          fi
